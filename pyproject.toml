[project]
name = "demon-cry-tui"
description = "Terminal UI for DemonCry OSINT platform"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"]

dependencies = [
    "httpx>=0.28.1",
    "platformdirs>=4.14.5",
    "pydantic>=2.14.3",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "ruff>=0.16.6,<0.17.0",
]

[project.scripts]
demon-cry-tui = "demon_cry_tui.app:run"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
